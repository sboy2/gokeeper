name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
    contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest
      # later:
      # - name: Check formatting
      #   run: uv run ruff format --check .
      # - name: Check linting
      #   run: uv run ruff check .